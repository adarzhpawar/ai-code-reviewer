services:
  - type: web
    name: codereview-ai-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
